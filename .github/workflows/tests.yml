name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:  # throwaway DB; conftest creates the Supabase stub and runs the migrations
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lesson_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/lesson_test
      PYTHONUNBUFFERED: "1"
      # No OpenAI or Supabase secrets: live LLM tests skip; everything else is mocked or uses the local DB.

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            frontend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        shell: bash
        run: |
          pytest -q -rs | tee pytest.log
          if grep -q "TEST_DATABASE_URL not set" pytest.log; then
            echo "::error::Database tests were skipped - CI must run them."
            exit 1
          fi
